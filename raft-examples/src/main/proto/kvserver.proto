syntax = "proto3";

package kvserver;

option java_package = "io.github.xinfra.lab.raft.examples.proto";
option java_outer_classname = "KvServerProto";
option java_multiple_files = true;

service KvService {
    rpc Get(GetRequest) returns (GetResponse);
    rpc Put(PutRequest) returns (PutResponse);
    rpc PutIfAbsent(PutIfAbsentRequest) returns (PutIfAbsentResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message GetRequest {
    string key = 1;
}

message GetResponse {
    string value = 1;
    bool found = 2;
}

message PutRequest {
    string key = 1;
    string value = 2;
}

message PutResponse {}

message PutIfAbsentRequest {
    string key = 1;
    string value = 2;
}

message PutIfAbsentResponse {
    // True if the key was absent and the value was stored; false if the key
    // already existed and was left unchanged.
    bool applied = 1;
    // The value currently associated with the key: the newly stored value when
    // applied is true, otherwise the pre-existing value.
    string value = 2;
}

message DeleteRequest {
    string key = 1;
}

message DeleteResponse {}

message KvSnapshotData {
    repeated KvEntry entries = 1;
}

message KvEntry {
    string key = 1;
    string value = 2;
}

// Serialized into raft log entries as the state-machine command.
message KvCommand {
    enum Op {
        PUT = 0;
        DELETE = 1;
        PUT_IF_ABSENT = 2;
    }
    Op op = 1;
    string key = 2;
    string value = 3;
}

// Envelope written into raft log entries. Wraps the state-machine command
// (a serialized KvCommand) together with a proposal id used to correlate the
// committed entry back to the waiting CompletableFuture on the proposing node.
// A proposal_id of 0 means the entry is untracked (no future to complete).
message TrackedEntry {
    fixed64 proposal_id = 1;
    bytes payload = 2;
}
